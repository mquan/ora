<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>gregorian</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        font: 15px/1.5 system-ui, -apple-system, sans-serif;
        max-width: 60rem;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      h1 { font-size: 1.4rem; margin-bottom: 0.25rem; }
      .sub { opacity: 0.7; margin-top: 0; }
      table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
      th, td { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid #8884; }
      th { font-weight: 600; opacity: 0.8; }
      .status { font-variant: small-caps; }
      .empty, .error { opacity: 0.7; margin-top: 1rem; }
      .error { color: #c0392b; }
      code { background: #8882; padding: 0 0.25rem; border-radius: 3px; }
    </style>
  </head>
  <body>
    <h1>gregorian</h1>
    <p class="sub">A calendar your agents read AND write — timeline (bootstrap view).</p>
    <div id="app"><p class="empty">Loading timeline…</p></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
